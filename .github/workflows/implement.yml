# Reusable: build sub-agent.
#
#   mode=implement  issue #N  → branch agent/issue-N → planner + implementer → push → PR "Closes #N"
#   mode=fix        PR #P     → same branch → implementer fixes CI failure / review findings → push
#
# Three jobs, so the agent never holds a write credential (docs/SECURITY.md, "lethal
# trifecta"):
#   prepare  write token, runs no project code — circuit breaker, branch, start commit
#   agent    READ-ONLY token — project setup + Claude; its commits leave as a git bundle
#   publish  write token on a clean runner — verifies the bundle (descends from the start
#            commit, no .github/workflows/ changes unless allowed), pushes, opens the PR
# Nothing the agent (or code it runs) writes — .git/config, hooks, $GITHUB_ENV, binaries —
# reaches the job that pushes. A circuit breaker stops the fix loop after
# `max-fix-attempts` and hands the PR to a human (`needs-human`).
#
# Caller examples: templates/.github/workflows/agent-implement.yml, agent-merge-gate.yml
name: implement

on:
  workflow_call:
    inputs:
      mode:
        description: implement | fix
        type: string
        default: implement
      issue-number:
        description: Issue to implement (mode=implement).
        type: number
        default: 0
      pr-number:
        description: Agent PR to fix (mode=fix).
        type: number
        default: 0
      head-sha:
        description: mode=fix — the PR head the failure was seen on; the run is skipped if the PR moved on.
        type: string
        default: ""
      base-branch:
        type: string
        default: develop
      branch-prefix:
        type: string
        default: agent/issue-
      setup-command:
        description: Shell command that installs the project's dependencies before Claude runs.
        type: string
        default: ""
      extra-allowed-tools:
        description: >-
          Comma-separated extra Claude tools, typically the project's own commands,
          e.g. "Bash(npm ci),Bash(npm run:*),Bash(npm test:*),Bash(npx prettier:*)".
        type: string
        default: ""
      model:
        type: string
        default: sonnet
      max-turns:
        type: number
        default: 80
      timeout-minutes:
        type: number
        default: 45
      max-fix-attempts:
        description: Circuit breaker — fix attempts per PR before labelling needs-human.
        type: number
        default: 3
      ci-workflow:
        description: Name of the caller's CI workflow (used to fetch failing logs).
        type: string
        default: CI
      ci-dispatch-workflow:
        description: >-
          CI workflow *file* (e.g. ci.yml, must have workflow_dispatch) to dispatch after
          a push when no GitHub App token is configured, because pushes made with
          GITHUB_TOKEN do not trigger workflows. Empty = don't dispatch.
        type: string
        default: ""
      review-dispatch-workflow:
        description: >-
          Review workflow *file* (e.g. agent-review.yml, needs a workflow_dispatch input `pr`)
          to dispatch after a push when no GitHub App token is configured. Empty = don't.
        type: string
        default: ""
      toolkit-marketplace:
        type: string
        default: https://github.com/kokoroou/agent-toolkit.git
      allowed-bots:
        description: >-
          Bots allowed to trigger Claude (claude-code-action refuses bot actors by default,
          but agent pushes/PRs are made by a bot). "*" is fine for private repos.
        type: string
        default: "*"
      allow-workflow-changes:
        description: >-
          Let the agent push changes to .github/workflows/ (asks the GitHub App token for the
          Workflows permission, which the App must have). Off by default: a prompt-injected
          agent should not be able to rewrite CI.
        type: boolean
        default: false
    secrets:
      anthropic_api_key:
        required: false
      claude_code_oauth_token:
        required: false
      agent_app_id:
        description: GitHub App id — recommended, so the agent's pushes and PRs trigger CI.
        required: false
      agent_app_private_key:
        required: false
    outputs:
      status:
        description: done | partial | blocked | skipped | circuit-open
        value: ${{ jobs.publish.outputs.status || jobs.prepare.outputs.status }}
      pr-number:
        value: ${{ jobs.publish.outputs.pr || jobs.prepare.outputs.pr }}

# One build per issue / PR at a time, across all three jobs.
concurrency:
  group: agent-build-${{ github.repository }}-${{ inputs.mode == 'fix' && format('pr-{0}', inputs.pr-number) || format('issue-{0}', inputs.issue-number) }}
  cancel-in-progress: false

jobs:
  # ── 1. prepare: write token, no project code ─────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      skip: ${{ steps.ctx.outputs.skip }}
      status: ${{ steps.ctx.outputs.status }}
      pr: ${{ steps.ctx.outputs.pr }}
      branch: ${{ steps.ctx.outputs.branch }}
      issue: ${{ steps.ctx.outputs.issue }}
      attempt: ${{ steps.ctx.outputs.attempt }}
      before: ${{ steps.ctx.outputs.before }}
    env:
      HAS_APP: ${{ secrets.agent_app_id != '' }}
      MODE: ${{ inputs.mode }}
      ISSUE: ${{ inputs.issue-number }}
      PR: ${{ inputs.pr-number }}
      BASE: ${{ inputs.base-branch }}
      MARKER_FIX: "<!-- agent-toolkit:fix-attempt -->"
    steps:
      - name: Mint GitHub App token
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.agent_app_id }}
          private-key: ${{ secrets.agent_app_private_key }}
          # Scoped token: only what this job needs, not every permission of the App.
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write

      - name: Resolve context and circuit breaker
        id: ctx
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          MAX_FIX: ${{ inputs.max-fix-attempts }}
          PREFIX: ${{ inputs.branch-prefix }}
          HEAD_SHA: ${{ inputs.head-sha }}
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          skip() { echo "status=$1" >>"$GITHUB_OUTPUT"; echo "skip=true" >>"$GITHUB_OUTPUT"; echo "$2"; exit 0; }
          if [[ "$MODE" == implement ]]; then
            [[ "$ISSUE" -gt 0 ]] || { echo "::error::issue-number is required"; exit 1; }
            json=$(gh issue view "$ISSUE" --repo "$R" --json state,labels)
            [[ $(jq -r .state <<<"$json") == OPEN ]] || skip skipped "Issue #$ISSUE is not open."
            jq -e '[.labels[].name] | index("needs-human")' <<<"$json" >/dev/null && skip skipped "Issue #$ISSUE needs a human."
            branch="${PREFIX}${ISSUE}"
            pr=$(gh pr list --repo "$R" --head "$branch" --state open --json number --jq '.[0].number // empty')
            if [[ -n "$pr" ]]; then
              skip skipped "PR #$pr already exists for $branch; use mode=fix to iterate on it."
            fi
            # Start commit: an earlier run's branch if one exists, else the base branch.
            before=$(gh api "repos/$R/git/ref/heads/$branch" --jq .object.sha 2>/dev/null \
                     || gh api "repos/$R/git/ref/heads/$BASE" --jq .object.sha)
          elif [[ "$MODE" == fix ]]; then
            [[ "$PR" -gt 0 ]] || { echo "::error::pr-number is required"; exit 1; }
            json=$(gh pr view "$PR" --repo "$R" --json state,labels,headRefName,headRefOid,isCrossRepository,body,comments)
            [[ $(jq -r .state <<<"$json") == OPEN ]] || skip skipped "PR #$PR is not open."
            if [[ -n "$HEAD_SHA" && $(jq -r .headRefOid <<<"$json") != "$HEAD_SHA" ]]; then
              skip skipped "PR #$PR moved past $HEAD_SHA; this failure is stale."
            fi
            [[ $(jq -r .isCrossRepository <<<"$json") == false ]] || skip skipped "PR #$PR is from a fork."
            labels=$(jq -r '[.labels[].name] | join(",")' <<<"$json")
            [[ ",$labels," == *",agent,"* ]] || skip skipped "PR #$PR is not an agent PR."
            [[ ",$labels," == *",needs-human,"* ]] && skip skipped "PR #$PR needs a human."
            branch=$(jq -r .headRefName <<<"$json")
            before=$(jq -r .headRefOid <<<"$json")
            ISSUE=$(jq -r '.body' <<<"$json" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' | head -1 | grep -oE '[0-9]+' || echo 0)
            attempts=$(jq --arg m "$MARKER_FIX" '[.comments[] | select(.body | contains($m))] | length' <<<"$json")
            echo "attempt=$((attempts + 1))" >>"$GITHUB_OUTPUT"
            echo "pr=$PR" >>"$GITHUB_OUTPUT"
            if [[ "$attempts" -ge "$MAX_FIX" ]]; then
              gh label create needs-human --repo "$R" --color d93f0b >/dev/null 2>&1 || true
              gh pr edit "$PR" --repo "$R" --add-label needs-human >/dev/null
              if [[ "$ISSUE" -gt 0 ]]; then gh issue edit "$ISSUE" --repo "$R" --add-label needs-human >/dev/null || true; fi
              gh pr comment "$PR" --repo "$R" --body "🛑 Circuit breaker: $attempts automatic fix attempts did not get this PR green. Labelled \`needs-human\`; the agent will not touch it again until the label is removed." >/dev/null
              skip circuit-open "Circuit breaker open after $attempts attempts."
            fi
          else
            echo "::error::mode must be implement or fix"; exit 1
          fi
          [[ "$before" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::cannot resolve the start commit"; exit 1; }
          { echo "branch=$branch"; echo "issue=$ISSUE"; echo "before=$before"; } >>"$GITHUB_OUTPUT"

  # ── 2. agent: read-only token; untrusted input + code execution live only here ───
  agent:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    outputs:
      result: ${{ steps.claude.outputs.structured_output }}
    env:
      MODE: ${{ inputs.mode }}
      PR: ${{ inputs.pr-number }}
      BRANCH: ${{ needs.prepare.outputs.branch }}
      BEFORE: ${{ needs.prepare.outputs.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.before }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare branch and failure context
        id: prep
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
        run: |
          set -euo pipefail
          git config user.name "agent-toolkit[bot]"
          git config user.email "agent-toolkit[bot]@users.noreply.github.com"
          mkdir -p .agent-context && echo ".agent-context/" >>.git/info/exclude
          git checkout -q -B "$BRANCH"
          if [[ "$MODE" == fix ]]; then
            ctx=.agent-context/failure.md
            {
              echo "# Failure context for PR #$PR (head $BEFORE)"
              run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$CI_WORKFLOW" --commit "$BEFORE" \
                      --json databaseId,conclusion --jq '[.[] | select(.conclusion == "failure")][0].databaseId // empty')
              if [[ -n "$run" ]]; then
                echo; echo "## Failing CI log excerpt (run $run, last 400 lines of failed steps)"; echo '```'
                gh run view "$run" --repo "$GITHUB_REPOSITORY" --log-failed | cut -c1-400 | tail -n 400 || true
                echo '```'
              fi
              echo; echo "## Blocking review findings on the current head"
              gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" --paginate \
                --jq ".[] | select(.commit_id == \"$BEFORE\") | \"- \(.path):\(.line // .original_line) — \(.body | gsub(\"\\n\"; \" \") | .[0:800])\"" || true
              gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json comments \
                --jq '[.comments[] | select(.body | contains("<!-- agent-toolkit:review -->"))] | last | .body // ""' || true
            } >"$ctx"
            echo "Context: $(wc -l <"$ctx") lines"
          fi

      - name: Project setup
        if: inputs.setup-command != ''
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }} # caller-owned; via env, not interpolated into the script
        run: eval "$SETUP_COMMAND"

      - name: Claude Code
        id: claude
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        env:
          # Read-only (job permissions): enough for `gh issue view` / `gh pr view`.
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          github_token: ${{ github.token }}
          allowed_bots: ${{ inputs.allowed-bots }}
          plugin_marketplaces: ${{ inputs.toolkit-marketplace }}
          plugins: pipeline@agent-toolkit
          prompt: >-
            ${{ inputs.mode == 'fix'
                && format('/pipeline:fix-pr {0} .agent-context/failure.md', inputs.pr-number)
                || format('/pipeline:implement-issue {0}', inputs.issue-number) }}
          claude_args: >-
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max-turns }}
            --allowedTools "Read,Edit,MultiEdit,Write,Glob,Grep,Task,Agent,TodoWrite,Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git rm:*),Bash(git mv:*),Bash(git restore:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(ls:*),Bash(cat:*)${{ inputs.extra-allowed-tools != '' && format(',{0}', inputs.extra-allowed-tools) || '' }}"
            --disallowedTools "WebFetch,WebSearch,Bash(curl:*),Bash(wget:*),Bash(git push:*),Bash(git remote:*),Bash(git config:*),Bash(git checkout:*),Bash(git switch:*),Bash(git reset:*),Bash(git rebase:*)"
            --json-schema '{"type":"object","additionalProperties":false,"required":["status","summary","risk"],"properties":{"status":{"enum":["done","partial","blocked"]},"summary":{"type":"string","maxLength":4000},"risk":{"enum":["low","medium","high"]},"pr_title":{"type":"string","maxLength":120},"pr_body":{"type":"string","maxLength":20000}}}'

      - name: Bundle the agent's commits
        if: always() && steps.prep.outcome == 'success'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/agent-out"; mkdir -p "$out"
          # Anything Claude left uncommitted is committed so nothing is silently lost.
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -q -m "chore: include uncommitted agent changes"
          fi
          n=$(git rev-list --count "$BEFORE..HEAD")
          echo "$n new commit(s)"
          if [[ "$n" -gt 0 ]]; then git bundle create "$out/agent.bundle" "$BEFORE..HEAD"; fi

      - name: Upload agent output
        if: always() && steps.prep.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-output
          path: ${{ runner.temp }}/agent-out/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

      - name: Usage summary
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXEC: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r '[.[] | select(.type == "result")] | last // {} |
            "Claude: $\(.total_cost_usd // "?") · \(.num_turns // "?") turns · \((.duration_ms // 0) / 1000 | floor)s"' \
            "$EXEC" >>"$GITHUB_STEP_SUMMARY" || true

      - name: Upload transcript
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: transcript-${{ inputs.mode }}-${{ inputs.mode == 'fix' && inputs.pr-number || inputs.issue-number }}-${{ github.run_attempt }}
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 30

  # ── 3. publish: write token on a clean runner; agent output is untrusted data ────
  publish:
    needs: [prepare, agent]
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    outputs:
      status: ${{ steps.publish.outputs.status }}
      pr: ${{ steps.publish.outputs.pr }}
    env:
      HAS_APP: ${{ secrets.agent_app_id != '' }}
      MODE: ${{ inputs.mode }}
      ISSUE: ${{ inputs.issue-number }}
      PR: ${{ inputs.pr-number }}
      BASE: ${{ inputs.base-branch }}
      MARKER_FIX: "<!-- agent-toolkit:fix-attempt -->"
    steps:
      - name: Mint GitHub App token
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.agent_app_id }}
          private-key: ${{ secrets.agent_app_private_key }}
          # Scoped token: only what this job needs, not every permission of the App.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-actions: write
          permission-workflows: ${{ inputs.allow-workflow-changes && 'write' || '' }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.before }}
          token: ${{ steps.app.outputs.token || github.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download agent output
        continue-on-error: true # no artifact = the agent job failed before bundling
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-output
          path: ${{ runner.temp }}/agent-out

      - name: Verify, push and open / update PR
        id: publish
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          PUSH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          OUT: ${{ needs.agent.outputs.result }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          LINKED_ISSUE: ${{ needs.prepare.outputs.issue }}
          ATTEMPT: ${{ needs.prepare.outputs.attempt }}
          BEFORE: ${{ needs.prepare.outputs.before }}
          ALLOW_WF: ${{ inputs.allow-workflow-changes }}
          DISPATCH: ${{ inputs.ci-dispatch-workflow }}
          REVIEW_DISPATCH: ${{ inputs.review-dispatch-workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          ensure() { gh label create "$1" --repo "$R" --color "$2" >/dev/null 2>&1 || true; }
          # The agent's structured output is untrusted: keep only the known shape.
          jq -e 'type == "object" and (.status | IN("done","partial","blocked")) and (.risk | IN("low","medium","high"))' \
            <<<"${OUT:-null}" >/dev/null 2>&1 \
            || OUT='{"status":"blocked","summary":"Claude did not return a result (error, timeout or max-turns). See the transcript artifact.","risk":"medium"}'
          status=$(jq -r .status <<<"$OUT"); risk=$(jq -r .risk <<<"$OUT"); summary=$(jq -r '.summary // ""' <<<"$OUT")

          hand_to_human() { # <reason>
            ensure needs-human d93f0b
            local msg="🤖 $1

          $summary

          Labelled \`needs-human\`. [Run log]($RUN_URL)"
            if [[ "$MODE" == fix ]]; then
              gh pr edit "$PR" --repo "$R" --add-label needs-human >/dev/null
              gh pr comment "$PR" --repo "$R" --body "$MARKER_FIX
          $msg" >/dev/null
            else
              gh issue edit "$ISSUE" --repo "$R" --add-label needs-human >/dev/null
              gh issue comment "$ISSUE" --repo "$R" --body "$msg" >/dev/null
            fi
            echo "status=blocked" >>"$GITHUB_OUTPUT"
            exit 0
          }

          # The bundle must only add commits on top of the start commit prepare resolved.
          bundle="$RUNNER_TEMP/agent-out/agent.bundle" commits=0
          if [[ -f "$bundle" ]]; then
            git bundle verify -q "$bundle" >/dev/null || hand_to_human "The agent's output bundle is invalid; nothing was pushed."
            git fetch -q "$bundle" HEAD
            head=$(git rev-parse FETCH_HEAD)
            git merge-base --is-ancestor "$BEFORE" "$head" \
              || hand_to_human "The agent's commits do not build on $BEFORE; nothing was pushed."
            commits=$(git rev-list --count "$BEFORE..$head")
          fi
          [[ "$commits" -gt 0 ]] || hand_to_human "Agent run produced no commits (status \`$status\`)."
          if [[ "$ALLOW_WF" != true ]] && git diff --name-only "$BEFORE" "$head" | grep -q '^\.github/workflows/'; then
            hand_to_human "The agent changed files in \`.github/workflows/\`, which needs \`allow-workflow-changes: true\`; nothing was pushed."
          fi

          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${R}.git" "$head:refs/heads/$BRANCH"

          if [[ "$MODE" == implement ]]; then
            title=$(jq -r '.pr_title // empty' <<<"$OUT")
            [[ -n "$title" ]] || title="feat: implement #$ISSUE"
            body=$(mktemp)
            { jq -r '.pr_body // .summary' <<<"$OUT"; echo; echo "Closes #$ISSUE"; echo; echo "---"; echo "_Opened by agent-toolkit · [run]($RUN_URL)_"; } >"$body"
            ensure agent 5319e7
            labels=(--label agent)
            if [[ "$risk" == high ]]; then ensure risk:high b60205; labels+=(--label risk:high); fi
            draft=(); [[ "$status" == "done" ]] || draft=(--draft)
            url=$(gh pr create --repo "$R" --base "$BASE" --head "$BRANCH" --title "$title" --body-file "$body" "${labels[@]}" "${draft[@]}")
            pr="${url##*/}"
            gh issue comment "$ISSUE" --repo "$R" --body "🤖 Opened $url (status \`$status\`)." >/dev/null
          else
            pr="$PR"
            [[ "$risk" == high ]] && { ensure risk:high b60205; gh pr edit "$pr" --repo "$R" --add-label risk:high >/dev/null; }
            gh pr comment "$pr" --repo "$R" --body "$MARKER_FIX
          🔧 Fix attempt $ATTEMPT — status \`$status\`, $commits commit(s) pushed.

          $summary

          [Run log]($RUN_URL)" >/dev/null
          fi

          # GITHUB_TOKEN pushes/PRs trigger no workflows; dispatch CI and review on the
          # branch itself so their runs carry the PR head SHA the merge gate looks up.
          if [[ "$HAS_APP" != true ]]; then
            if [[ -z "$DISPATCH" || -z "$REVIEW_DISPATCH" ]]; then
              echo "::warning::Pushed with GITHUB_TOKEN — set ci-dispatch-workflow and review-dispatch-workflow (or configure a GitHub App), otherwise CI/review will not run on this push."
            fi
            [[ -z "$DISPATCH" ]] || gh workflow run "$DISPATCH" --repo "$R" --ref "$BRANCH"
            [[ -z "$REVIEW_DISPATCH" ]] || gh workflow run "$REVIEW_DISPATCH" --repo "$R" --ref "$BRANCH" -f pr="$pr"
          fi
          echo "status=$status" >>"$GITHUB_OUTPUT"
          echo "pr=$pr" >>"$GITHUB_OUTPUT"
          echo "### $MODE → \`$status\`, PR #$pr, $commits commit(s)" >>"$GITHUB_STEP_SUMMARY"
