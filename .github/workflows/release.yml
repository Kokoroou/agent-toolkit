# Reusable: release on `main` with release-please.
#
# Each push to main (i.e. after you merge develop → main) updates a release PR that
# bumps the version and changelog from Conventional Commits. Merging that release PR
# creates the tag + GitHub Release, then the build job attaches artifacts.
#
# Caller example: templates/.github/workflows/release.yml
name: release

on:
  workflow_call:
    inputs:
      release-type:
        description: release-please strategy (simple, node, python, go, rust, java, …). Ignored when config-file is set.
        type: string
        default: simple
      target-branch:
        type: string
        default: main
      config-file:
        description: Optional release-please-config.json path (monorepos, custom sections).
        type: string
        default: ""
      manifest-file:
        type: string
        default: ""
      setup-command:
        type: string
        default: ""
      build-command:
        description: Builds release artifacts. Empty = no build.
        type: string
        default: ""
      artifact-paths:
        description: Newline-separated globs uploaded to the GitHub Release.
        type: string
        default: ""
    secrets:
      agent_app_id:
        description: Optional — with an App token the release PR also triggers CI.
        required: false
      agent_app_private_key:
        required: false
    outputs:
      release-created:
        value: ${{ jobs.release-please.outputs.release_created }}
      tag-name:
        value: ${{ jobs.release-please.outputs.tag_name }}
      version:
        value: ${{ jobs.release-please.outputs.version }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      HAS_APP: ${{ secrets.agent_app_id != '' }}
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - name: Mint GitHub App token
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.agent_app_id }}
          private-key: ${{ secrets.agent_app_private_key }}
          # Scoped token: only what this job needs, not every permission of the App.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          target-branch: ${{ inputs.target-branch }}
          release-type: ${{ inputs.config-file == '' && inputs.release-type || '' }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
      # release-please lists every commit, so a change that reaches main through more than
      # one commit with the same message (e.g. cherry-picked, or merged via develop and a
      # hotfix) appears several times. Collapse identical entries in the same section into
      # one line listing all commits — `* msg ([a](…), [b](…))` — in the release PR body
      # (which becomes the GitHub Release notes on merge) and in the CHANGELOG files of the
      # release branch. Re-applied on every run, since release-please rewrites both.
      - name: Merge duplicate changelog entries
        if: steps.rp.outputs.pr != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          PR: ${{ steps.rp.outputs.pr }}
        run: |
          set -euo pipefail
          cat >"$RUNNER_TEMP/dedupe.py" <<'PY'
          import re, sys
          # `* text ([sha](url))rest` — release-please's entry format (rest: ", closes #N").
          entry = re.compile(r"^(\* .*?) \((\[[0-9a-f]{7,40}\]\([^)]*\))\)(.*)$")
          out, seen = [], {}
          for line in sys.stdin.read().split("\n"):
              m = entry.match(line)
              if not m:
                  if line.startswith("#") or line.startswith("<"):
                      seen = {}  # new section / package: only merge within one list
                  out.append(line)
                  continue
              key = (m.group(1), m.group(3))
              if key in seen:
                  links = out[seen[key]][1]
                  if m.group(2) not in links:
                      links.append(m.group(2))
                  continue
              seen[key] = len(out)
              out.append((key, [m.group(2)]))
          sys.stdout.write("\n".join(
              l if isinstance(l, str) else f"{l[0][0]} ({', '.join(l[1])}){l[0][1]}" for l in out))
          PY
          number=$(jq -r .number <<<"$PR")
          branch=$(jq -r .headBranchName <<<"$PR")

          gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json body --jq .body >"$RUNNER_TEMP/body.md"
          python3 "$RUNNER_TEMP/dedupe.py" <"$RUNNER_TEMP/body.md" >"$RUNNER_TEMP/body.new.md"
          if ! cmp -s "$RUNNER_TEMP/body.md" "$RUNNER_TEMP/body.new.md"; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.new.md"
          fi

          # CHANGELOG files on the release branch, via the contents API (no checkout).
          for path in $(gh api "repos/$GITHUB_REPOSITORY/pulls/$number/files" --paginate \
            --jq '.[] | select(.filename | test("(^|/)CHANGELOG\\.md$")) | .filename'); do
            meta=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$branch")
            jq -r .content <<<"$meta" | base64 -d >"$RUNNER_TEMP/cl.md"
            python3 "$RUNNER_TEMP/dedupe.py" <"$RUNNER_TEMP/cl.md" >"$RUNNER_TEMP/cl.new.md"
            cmp -s "$RUNNER_TEMP/cl.md" "$RUNNER_TEMP/cl.new.md" && continue
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
              -f message="chore: merge duplicate changelog entries" -f branch="$branch" \
              -f sha="$(jq -r .sha <<<"$meta")" -f content="$(base64 -w0 <"$RUNNER_TEMP/cl.new.md")" >/dev/null
          done

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && inputs.build-command != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Setup
        if: inputs.setup-command != ''
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }} # caller-owned; via env, not interpolated into the script
        run: eval "$SETUP_COMMAND"
      - name: Build
        env:
          BUILD_COMMAND: ${{ inputs.build-command }} # caller-owned; via env, not interpolated into the script
        run: eval "$BUILD_COMMAND"
      - name: Upload artifacts to the release
        if: inputs.artifact-paths != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          PATHS: ${{ inputs.artifact-paths }}
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          files=()
          while IFS= read -r g; do
            [[ -z "$g" ]] && continue
            # shellcheck disable=SC2206
            files+=($g)
          done <<<"$PATHS"
          [[ ${#files[@]} -gt 0 ]] || { echo "::error::no files match artifact-paths"; exit 1; }
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
