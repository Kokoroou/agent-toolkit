# The toolkit's own CI: manifests, workflows, caller templates and scripts, plus
# security scans of the toolkit itself.
name: self-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: 1.7.12
  ZIZMOR_VERSION: 1.30.1

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Install tools
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code
          # Download script from the release tag (not a moving branch).
          bash <(curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
          echo "$PWD" >>"$GITHUB_PATH"
      - run: scripts/lint.sh
      - name: Bootstrap into a scratch repo
        run: |
          d=$(mktemp -d) && git -C "$d" init -q
          scripts/bootstrap.sh "$d" --ref v1 --no-labels
          ! grep -rn "agent-toolkit/.github/workflows/.*@main" "$d/.github/workflows"

  # Static security audit of the workflows (template injection, excessive permissions,
  # credential persistence, unpinned actions, known-vulnerable actions, …). Blocking
  # from medium severity; accepted findings are ignored inline, config in .github/zizmor.yml.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pipx run "zizmor==$ZIZMOR_VERSION" --format github --min-severity medium \
            .github/workflows templates/.github/workflows

  # Dogfood the reusable quality gate: Gitleaks (secrets in history) + Semgrep.
  security:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      enable-pr-title-check: false
      baseline-branch: main
