# Reusable: triage one issue.
#
# Claude only *reads* the issue and returns a structured decision; this workflow
# applies labels / comments / Projects fields deterministically from that decision,
# so a prompt-injected issue cannot make the agent do anything except pick labels.
#
# Caller example: templates/.github/workflows/agent-triage.yml
name: triage

on:
  workflow_call:
    inputs:
      issue-number:
        description: Issue to triage.
        type: number
        required: true
      max-rounds:
        description: >-
          Max clarification rounds (1–5, larger values are capped at 5) before handing the
          issue to a human. Rounds are counted per triage cycle: re-triaging an issue after a
          ready / needs-human / reject decision starts again at 0.
        type: number
        default: 5
      model:
        description: Claude model id or alias.
        type: string
        default: sonnet
      max-turns:
        type: number
        default: 25
      timeout-minutes:
        type: number
        default: 10
      project-owner:
        description: GitHub Projects (v2) owner (user or org). Empty = skip Projects.
        type: string
        default: ""
      project-number:
        description: GitHub Projects (v2) number. Empty = skip Projects.
        type: string
        default: ""
      dispatch-on-ready:
        description: >-
          Workflow file (e.g. agent-implement.yml, needs a workflow_dispatch input `issue`)
          to dispatch when an issue becomes ready. Labels added with GITHUB_TOKEN do not
          trigger `issues: labeled`, workflow_dispatch does. Empty (default) = a person builds
          the issue in Claude Code with `/pipeline:build <issue>`.
        type: string
        default: ""
      auto-implement-max-size:
        description: Largest size (XS|S|M|L) that is auto-implemented; bigger issues wait for a human.
        type: string
        default: M
      auto-implement-trusted-only:
        description: >-
          Only auto-implement issues opened by the repo's OWNER / MEMBER / COLLABORATOR, so an
          outsider's issue on a public repo cannot start the write-enabled build agent.
        type: boolean
        default: true
      toolkit-marketplace:
        description: >-
          Git URL of the plugin marketplace to install the pipeline plugin from; `#<ref>`
          pins a branch or tag. Keep it on the same ref as this workflow's `uses: …@<ref>`.
        type: string
        default: https://github.com/kokoroou/agent-toolkit.git#v0
      allowed-bots:
        description: >-
          Bots allowed to trigger Claude (claude-code-action refuses bot actors by default,
          but agent pushes/PRs are made by a bot). "*" is fine for private repos.
        type: string
        default: "*"
    secrets:
      anthropic_api_key:
        required: false
      claude_code_oauth_token:
        required: false
      project_token:
        description: Classic PAT with `project` + `repo` scopes (GITHUB_TOKEN cannot write user-owned Projects).
        required: false
    outputs:
      decision:
        description: ready | clarify | needs-human | reject | skipped
        value: ${{ jobs.triage.outputs.decision }}
      risk:
        value: ${{ jobs.triage.outputs.risk }}
      size:
        value: ${{ jobs.triage.outputs.size }}
      priority:
        value: ${{ jobs.triage.outputs.priority }}

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      issues: write
      actions: write
    concurrency:
      group: agent-triage-${{ github.repository }}-${{ inputs.issue-number }}
      cancel-in-progress: true
    outputs:
      decision: ${{ steps.apply.outputs.decision || steps.pre.outputs.decision }}
      risk: ${{ steps.apply.outputs.risk }}
      size: ${{ steps.apply.outputs.size }}
      priority: ${{ steps.apply.outputs.priority }}
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ inputs.issue-number }}
      MARKER_Q: "<!-- agent-toolkit:triage-question -->"
      MARKER_S: "<!-- agent-toolkit:triage-summary -->"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pre-checks and clarification round count
        id: pre
        env:
          MAX_ROUNDS: ${{ inputs.max-rounds }}
        run: |
          set -euo pipefail
          json=$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json state,labels)
          state=$(jq -r .state <<<"$json")
          labels=$(jq -r '[.labels[].name] | join(",")' <<<"$json")
          max=${MAX_ROUNDS%%.*}
          if (( max > 5 )); then echo "::warning::max-rounds $MAX_ROUNDS capped at 5"; max=5; fi
          if (( max < 1 )); then max=1; fi
          # Rounds of this triage cycle only: bot questions after the latest bot summary
          # (ready / needs-human / reject), so a re-triaged issue starts again at 0. Only
          # bot comments count, so pasting a marker into a comment cannot move the count.
          rounds=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments?per_page=100" --paginate \
                     --jq '.[] | select(.user.type == "Bot") | {body}' \
                   | jq -s --arg q "$MARKER_Q" --arg s "$MARKER_S" '
                       ([to_entries[] | select(.value.body | contains($s)) | .key] | max // -1) as $last
                       | [.[$last + 1:][] | select(.body | contains($q))] | length')
          # Triaging an issue that was already ready means its requirements changed.
          was_ready=false; [[ ",$labels," == *",ready-for-plan,"* ]] && was_ready=true
          { echo "rounds=$rounds"; echo "max_rounds=$max"; echo "was_ready=$was_ready"; } >>"$GITHUB_OUTPUT"
          if [[ "$state" != "OPEN" ]] || [[ ",$labels," == *",needs-human,"* ]]; then
            echo "Issue #$ISSUE is closed or owned by a human; skipping."
            echo "decision=skipped" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve plugin marketplace
        id: marketplace
        if: steps.pre.outputs.skip != 'true'
        env:
          MARKETPLACE: ${{ inputs.toolkit-marketplace }}
        # claude-code-action accepts only URLs ending in `.git` or local paths, so a
        # `…git#<ref>` pin is fetched here and handed to it as a local path.
        run: |
          set -euo pipefail
          if [[ "$MARKETPLACE" != *'#'* ]]; then
            echo "Plugin marketplace: $MARKETPLACE"
            echo "source=$MARKETPLACE" >>"$GITHUB_OUTPUT"; exit 0
          fi
          url=${MARKETPLACE%%#*}; ref=${MARKETPLACE#*#}
          dir="$RUNNER_TEMP/agent-toolkit-marketplace"
          rm -rf "$dir"; git init -q "$dir"
          git -C "$dir" fetch -q --depth 1 "$url" "$ref"
          git -C "$dir" checkout -q FETCH_HEAD
          echo "Plugin marketplace: $url @ $ref ($(git -C "$dir" rev-parse HEAD)) -> $dir"
          echo "source=$dir" >>"$GITHUB_OUTPUT"

      - name: Claude triage (read-only)
        id: claude
        if: steps.pre.outputs.skip != 'true'
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        with:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          github_token: ${{ github.token }}
          allowed_bots: ${{ inputs.allowed-bots }}
          plugin_marketplaces: ${{ steps.marketplace.outputs.source }}
          plugins: pipeline@agent-toolkit
          prompt: /pipeline:triage-issue ${{ inputs.issue-number }} ${{ steps.pre.outputs.rounds }} ${{ steps.pre.outputs.max_rounds }}
          claude_args: >-
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max-turns }}
            --allowedTools "Read,Grep,Glob,Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search issues:*),Bash(gh label list:*)"
            --disallowedTools "WebFetch,WebSearch"
            --json-schema '{"type":"object","required":["decision","score","type","priority","risk","size","summary","questions","acceptance_criteria","duplicate_of"],"properties":{"decision":{"enum":["ready","clarify","needs-human","reject"]},"score":{"type":"integer","minimum":0,"maximum":5},"type":{"enum":["feature","bug","chore","docs"]},"priority":{"enum":["P0","P1","P2","P3"]},"risk":{"enum":["low","medium","high"]},"size":{"enum":["XS","S","M","L","XL"]},"language":{"type":"string","pattern":"^[a-z]{2,3}$"},"summary":{"type":"string"},"questions":{"type":"array","items":{"type":"string"}},"acceptance_criteria":{"type":"array","items":{"type":"string"}},"duplicate_of":{"type":["integer","null"]}}}'

      - name: Apply decision
        id: apply
        # Also runs when the Claude step failed, so a failed triage is handed to a person
        # instead of staying in needs-triage (and being re-run by every scheduled sweep).
        if: steps.pre.outputs.skip != 'true' && !cancelled()
        env:
          OUT: ${{ steps.claude.outputs.structured_output }}
          ROUNDS: ${{ steps.pre.outputs.rounds }}
          MAX_ROUNDS: ${{ steps.pre.outputs.max_rounds }}
          AUTO_BUILD: ${{ inputs.dispatch-on-ready != '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXEC: ${{ steps.claude.outputs.execution_file }}
          # More acceptance criteria than this → a person confirms the scope (keep in sync
          # with plugins/pipeline/commands/triage-issue.md).
          MAX_CRITERIA: 15
        run: |
          set -euo pipefail
          failed=false
          if [[ -z "$OUT" ]] || ! jq -e .decision <<<"$OUT" >/dev/null; then
            echo "::error::Claude returned no structured decision; handing issue #$ISSUE to a person"
            failed=true
            OUT='{"decision":"needs-human","summary":"","questions":[],"acceptance_criteria":[]}'
          fi
          get() { jq -r "$1" <<<"$OUT"; }
          decision=$(get .decision); risk=$(get .risk); size=$(get .size)
          prio=$(get .priority); type=$(get .type); score=$(get .score)
          if [[ "$failed" == true ]]; then risk=; size=; prio=; type=; score=; fi
          # The comment follows the issue author's language. Claude writes the free text in
          # it; the fixed text here exists in English and Vietnamese (anything else: English).
          lang=$(get '.language // "en"')
          # L "<English>" "<Vietnamese>": print the line in the comment's language.
          L() { if [[ "$lang" == vi ]]; then printf '%s\n' "$2"; else printf '%s\n' "$1"; fi; }
          # Guardrail: the agent cannot ask more than max-rounds times.
          if [[ "$decision" == clarify && "$ROUNDS" -ge "$MAX_ROUNDS" ]]; then decision=needs-human; fi
          # Guardrail: a long list of criteria is never cut; a person confirms the scope.
          n_ac=$(jq '.acceptance_criteria | length' <<<"$OUT")
          too_many=false
          if [[ "$decision" == ready && "$n_ac" -gt "$MAX_CRITERIA" ]]; then decision=needs-human; too_many=true; fi

          body=$(mktemp)
          summary=$(get .summary)
          next_human() {
            L "**Next:** decide, then remove \`needs-human\` and either" \
              "**Tiếp theo:** hãy quyết định, rồi gỡ \`needs-human\` và"
            L "- add \`ready-for-plan\` to build the issue as written, with all of its acceptance criteria, or" \
              "- thêm \`ready-for-plan\` để build issue đúng như đang viết, với toàn bộ acceptance criteria, hoặc"
            L "- edit the issue (for example to a shorter list of acceptance criteria, or split it) and add \`needs-triage\` to triage it again." \
              "- sửa issue (ví dụ rút gọn danh sách acceptance criteria, hoặc tách nhỏ) rồi thêm \`needs-triage\` để triage lại."
          }
          case "$decision" in
            clarify)
              {
                echo "$MARKER_Q"
                L "Thanks! Before this can be planned I need a bit more detail (round $((ROUNDS + 1))/$MAX_ROUNDS):" \
                  "Cảm ơn bạn! Trước khi lên kế hoạch, mình cần thêm một chút thông tin (vòng $((ROUNDS + 1))/$MAX_ROUNDS):"
                echo
                jq -r '.questions | to_entries[] | "\(.key + 1). \(.value)"' <<<"$OUT"
                echo
                L "_Reply in a comment or edit the issue; triage re-runs automatically._" \
                  "_Hãy trả lời bằng một comment hoặc sửa issue; triage sẽ tự chạy lại._"
              } >"$body" ;;
            ready)
              {
                echo "$MARKER_S"
                L "**Triage:** ready for planning — score $score/5 · \`$type\` · \`$prio\` · risk \`$risk\` · size \`$size\`" \
                  "**Triage:** sẵn sàng lên kế hoạch — điểm $score/5 · \`$type\` · \`$prio\` · risk \`$risk\` · size \`$size\`"
                echo
                echo "$summary"
                echo
                echo "**Acceptance criteria**"
                jq -r '.acceptance_criteria[] | "- [ ] \(.)"' <<<"$OUT"
                echo
                if [[ "$AUTO_BUILD" == true ]]; then
                  L "**Next:** the build agent starts on GitHub Actions when risk and size allow; otherwise build it in Claude Code with \`/pipeline:build $ISSUE\`, or add \`agent:implement\`." \
                    "**Tiếp theo:** build agent sẽ chạy trên GitHub Actions nếu risk và size cho phép; nếu không, hãy build trong Claude Code bằng \`/pipeline:build $ISSUE\`, hoặc thêm \`agent:implement\`."
                else
                  L "**Next:** build it in Claude Code, on your machine or on the web: \`/pipeline:build $ISSUE\` (or add \`agent:implement\` to build it on GitHub Actions)." \
                    "**Tiếp theo:** build trong Claude Code, trên máy của bạn hoặc trên web: \`/pipeline:build $ISSUE\` (hoặc thêm \`agent:implement\` để build trên GitHub Actions)."
                fi
                echo
                L "_To change the requirements, edit the issue (triage re-runs); to cancel, close it._" \
                  "_Muốn đổi yêu cầu thì sửa issue (triage sẽ chạy lại); muốn huỷ thì đóng issue._"
              } >"$body" ;;
            needs-human)
              {
                echo "$MARKER_S"
                if [[ "$failed" == true ]]; then
                  echo "**Triage:** automatic triage did not finish (error, timeout, max-turns, or output that did not match the schema), so this issue needs a person. [Run log and transcript]($RUN_URL)"
                  echo
                  # Why it stopped, from the transcript. The step "Run details" in the run
                  # log lists every tool call with its error.
                  if [[ -s "${EXEC:-}" ]]; then
                    jq -r '[.[] | select(.type == "result")] | last // {} |
                      def one: tostring | gsub("[\\s`]+"; " ");
                      "Reason: `\(.subtype // "no result")` after \(.num_turns // "?") turns. \((.errors // []) | join("; ") | one | .[0:300])",
                      (.permission_denials // [] | select(length > 0) |
                        "", "Denied tool calls (\(length)):",
                        (.[0:5][] | "- \(.tool_name): `\(.tool_input | .command // .file_path // . | one | .[0:200])`"))' \
                      "$EXEC" || true
                  else
                    echo "Reason: the Claude step left no transcript, so it failed before Claude ran; see that step's log."
                  fi
                  echo
                  echo "_To retry, remove \`needs-human\` and add \`needs-triage\`._"
                else
                  L "**Triage:** needs a human decision (score $score/5, risk \`$risk\`, size \`$size\`)." \
                    "**Triage:** cần người quyết định (điểm $score/5, risk \`$risk\`, size \`$size\`)."
                  echo
                  echo "$summary"
                  if [[ "$too_many" == true ]]; then
                    echo
                    L "The issue is otherwise ready, but it has $n_ac acceptance criteria (more than $MAX_CRITERIA), so a person confirms the scope." \
                      "Issue đã đủ ý, nhưng có $n_ac acceptance criteria (nhiều hơn $MAX_CRITERIA), nên cần người xác nhận phạm vi."
                  fi
                  if [[ "$n_ac" -gt 0 ]]; then
                    echo
                    if [[ "$too_many" == true ]]; then echo "**Acceptance criteria**"; else L "**Proposed acceptance criteria**" "**Acceptance criteria đề xuất**"; fi
                    jq -r '.acceptance_criteria[] | "- [ ] \(.)"' <<<"$OUT"
                  fi
                  echo
                  next_human
                fi
              } >"$body" ;;
            reject)
              { echo "$MARKER_S"; L "**Triage:** not actionable." "**Triage:** không thể xử lý issue này."; echo; echo "$summary"; } >"$body"
              dup=$(get '.duplicate_of // empty')
              # "Duplicate of #N" stays in English in every language: GitHub recognises it.
              if [[ -n "$dup" ]]; then { echo; echo "Duplicate of #$dup."; } >>"$body"; fi ;;
          esac
          # GitHub rejects comments over 65536 characters. Never cut the text: hand the issue
          # to a person with a pointer to the full output in the run log instead.
          if (( $(wc -c <"$body") > 65000 )); then
            echo "::warning::Triage comment is too long to post; handing issue #$ISSUE to a person"
            jq . <<<"$OUT"
            decision=needs-human
            {
              echo "$MARKER_S"
              L "**Triage:** the triage result is too long to post as a comment, so this issue needs a person. The full result is in the [run log]($RUN_URL)." \
                "**Triage:** kết quả triage quá dài để đăng thành comment, nên issue này cần một người xử lý. Kết quả đầy đủ nằm trong [run log]($RUN_URL)."
              echo
              next_human
            } >"$body"
          fi

          existing=$(gh label list --repo "$GITHUB_REPOSITORY" --limit 500 --json name --jq '.[].name')
          ensure() { grep -qxF "$1" <<<"$existing" || gh label create "$1" --repo "$GITHUB_REPOSITORY" --color "$2" >/dev/null || true; }
          current=$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          remove=()
          while read -r l; do
            case "$l" in
              needs-triage|awaiting-clarification|ready-for-plan) remove+=(--remove-label "$l") ;;
              # A failed run has no classification: keep the labels of the last triage.
              type:*|priority:*|risk:*|size:*) [[ "$failed" == true ]] || remove+=(--remove-label "$l") ;;
            esac
          done <<<"$current"
          add=()
          [[ "$failed" == true ]] || add=("type:$type" "priority:$prio" "risk:$risk" "size:$size")
          case "$decision" in
            ready)       add+=(ready-for-plan) ;;
            clarify)     add+=(awaiting-clarification) ;;
            needs-human) add+=(needs-human) ;;
          esac
          for l in "${add[@]}"; do ensure "$l" ededed; done
          args=(); for l in "${add[@]}"; do args+=(--add-label "$l"); done
          if [[ ${#remove[@]} -gt 0 ]]; then gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" "${remove[@]}" >/dev/null || true; fi
          if [[ ${#args[@]} -gt 0 ]]; then gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" "${args[@]}" >/dev/null; fi

          if [[ "$decision" == reject && -n "${dup:-}" ]]; then
            gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason "not planned" --comment "$(cat "$body")" >/dev/null
          else
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$body" >/dev/null
          fi

          {
            echo "decision=$decision"; echo "risk=$risk"; echo "size=$size"; echo "priority=$prio"
          } >>"$GITHUB_OUTPUT"
          if [[ "$failed" == true ]]; then
            echo "### Triage #$ISSUE → \`$decision\` (Claude returned no structured decision)" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "### Triage #$ISSUE → \`$decision\` (score $score, $prio, risk $risk, size $size)" >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Flag agent PRs built from the old requirements
        if: steps.apply.outputs.decision != '' && steps.pre.outputs.was_ready == 'true'
        env:
          DECISION: ${{ steps.apply.outputs.decision }}
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          # Issues API (PRs are issues): needs only `issues`, not `pull-requests`, permission.
          prs=$(gh api "repos/$R/issues?state=open&labels=agent&per_page=100" --paginate \
                  --jq '.[] | select(.pull_request) | {number, body, labels: [.labels[].name]}' \
                | jq -r --arg n "$ISSUE" '
                    select((.body // "") | test("(?i)\\b(close[sd]?|fix(e[sd])?|resolve[sd]?) #" + $n + "\\b"))
                    | select(.labels | index("needs-human") | not) | .number')
          [[ -n "$prs" ]] || exit 0
          gh label create needs-human --repo "$R" --color d93f0b >/dev/null 2>&1 || true
          for pr in $prs; do
            gh api -X POST "repos/$R/issues/$pr/labels" -f "labels[]=needs-human" >/dev/null
            gh api -X POST "repos/$R/issues/$pr/comments" -F body=@- >/dev/null <<EOF
          🛑 The requirements in #$ISSUE changed after this PR was built (re-triage → \`$DECISION\`). Labelled \`needs-human\`, so it will not be auto-fixed or merged.

          - To rebuild from the new requirements: close this PR and delete its branch, then (once #$ISSUE is \`ready-for-plan\`) run \`/pipeline:build $ISSUE\` in Claude Code or add \`agent:implement\`.
          - To keep it: update it by hand and remove \`needs-human\`.
          EOF
            echo "Flagged stale PR #$pr" >>"$GITHUB_STEP_SUMMARY"
          done

      - name: Add to GitHub Project and set fields
        if: steps.apply.outputs.decision == 'ready' && inputs.project-number != ''
        env:
          GH_TOKEN: ${{ secrets.project_token }}
          OWNER: ${{ inputs.project-owner || github.repository_owner }}
          NUMBER: ${{ inputs.project-number }}
          PRIORITY: ${{ steps.apply.outputs.priority }}
          SIZE: ${{ steps.apply.outputs.size }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then echo "::warning::project_token secret not set; skipping Projects."; exit 0; fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/issues/$ISSUE"
          item=$(gh project item-add "$NUMBER" --owner "$OWNER" --url "$url" --format json --jq .id)
          pid=$(gh project view "$NUMBER" --owner "$OWNER" --format json --jq .id)
          fields=$(gh project field-list "$NUMBER" --owner "$OWNER" --format json --limit 100)
          set_field() {
            local fid oid
            fid=$(jq -r --arg f "$1" '.fields[] | select(.name == $f) | .id' <<<"$fields")
            oid=$(jq -r --arg f "$1" --arg v "$2" '.fields[] | select(.name == $f) | .options[]? | select(.name == $v) | .id' <<<"$fields")
            if [[ -n "$fid" && -n "$oid" ]]; then
              gh project item-edit --id "$item" --project-id "$pid" --field-id "$fid" --single-select-option-id "$oid" >/dev/null
              echo "Set $1=$2"
            else
              echo "Project has no single-select field '$1' with option '$2'; skipped."
            fi
          }
          set_field Priority "$PRIORITY"
          set_field Size "$SIZE"

      - name: Hand off to the build agent
        if: steps.apply.outputs.decision == 'ready' && inputs.dispatch-on-ready != ''
        env:
          WF: ${{ inputs.dispatch-on-ready }}
          RISK: ${{ steps.apply.outputs.risk }}
          SIZE: ${{ steps.apply.outputs.size }}
          MAX_SIZE: ${{ inputs.auto-implement-max-size }}
          TRUSTED_ONLY: ${{ inputs.auto-implement-trusted-only }}
        run: |
          set -euo pipefail
          order=(XS S M L XL)
          idx() { local i; for i in "${!order[@]}"; do [[ "${order[$i]}" == "$1" ]] && echo "$i" && return; done; echo 99; }
          if [[ "$RISK" == high || $(idx "$SIZE") -gt $(idx "$MAX_SIZE") ]]; then
            echo "Not auto-implementing (risk=$RISK, size=$SIZE > $MAX_SIZE); build it with /pipeline:build $ISSUE or the agent:implement label."
            exit 0
          fi
          assoc=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" --jq .author_association)
          if [[ "$TRUSTED_ONLY" == true && ! " OWNER MEMBER COLLABORATOR " == *" $assoc "* ]]; then
            echo "Not auto-implementing: author is $assoc, not a collaborator; build it with /pipeline:build $ISSUE or the agent:implement label."
            exit 0
          fi
          gh workflow run "$WF" --repo "$GITHUB_REPOSITORY" --ref "$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)" -f issue="$ISSUE"
          echo "Dispatched $WF for #$ISSUE" >>"$GITHUB_STEP_SUMMARY"

      - name: Run details (usage, tool calls, errors)
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXEC: ${{ steps.claude.outputs.execution_file }}
        run: |
          # The action hides Claude's output. Print what is needed to debug a run without
          # downloading the transcript: how it ended, every tool call (input only) with its
          # error or denial inline, and Claude's last message. Tool output is not printed.
          jq -r '[.[] | select(.type == "result")] | last // {} |
            "Claude: $\(.total_cost_usd // "?") · \(.num_turns // "?") turns · \((.duration_ms // 0) / 1000 | floor)s · \(.subtype // "no result")"' \
            "$EXEC" >>"$GITHUB_STEP_SUMMARY" || true
          echo "::group::Claude tool calls (errors and denials inline)"
          jq -r '
            def one: tostring | gsub("\\s+"; " ");
            def text: if type == "array" then map(.text? // "") | join(" ") else . end | one;
            ([.[] | select(.type == "user") | .message.content | arrays | .[]
              | select(.type? == "tool_result") | {(.tool_use_id): .}] | add // {}) as $res
            | [.[] | select(.type == "assistant") | .message.content[]? | select(.type? == "tool_use")]
            | to_entries[] | .value as $t | $res[$t.id] as $r
            | "#\(.key + 1) \($t.name): \($t.input | .command // .file_path // .pattern // .skill // . | one | .[0:300])"
              + if $r.is_error then "\n     ✗ \($r.content | text | .[0:500])" else "" end' \
            "$EXEC" || true
          echo "::endgroup::"
          jq -r '
            ([.[] | select(.type == "assistant") | .message.content[]? | select(.type? == "text") | .text]
              | last // "(none)" | gsub("\\s+"; " ") | .[0:1000]) as $said
            | [.[] | select(.type == "result")] | last // {} |
            ((.permission_denials // [])[]
              | "::warning::Denied \(.tool_name): \(.tool_input | .command // .file_path // . | tostring | gsub("\\s+"; " ") | .[0:300])"),
            (select(.is_error == true or .subtype == null)
              | "::error::Claude run ended with \(.subtype // "no result") (\(.terminal_reason // "?")) after \(.num_turns // "?") turns: \((.errors // []) | join("; ") | gsub("\\s+"; " ") | .[0:500])",
                "Last message from Claude: \($said)")' \
            "$EXEC" || true

      - name: Upload transcript
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: transcript-triage-${{ inputs.issue-number }}-${{ github.run_attempt }}
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 30
