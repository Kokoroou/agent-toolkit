# Name is referenced by agent-merge-gate.yml.
name: Agent Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches: [develop]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true

permissions:
  contents: read

jobs:
  review:
    # Review agent PRs automatically; any other PR when someone adds the `agent` label.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'agent') &&
       (github.event.action != 'labeled' || github.event.label.name == 'agent'))
    uses: kokoroou/agent-toolkit/.github/workflows/review.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    with:
      pr-number: ${{ fromJSON(github.event.pull_request.number || inputs.pr) }}
      model: sonnet
      toolkit-marketplace: https://github.com/kokoroou/agent-toolkit.git#main # same ref as uses:
    # Only the secrets this workflow uses (not `secrets: inherit`).
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
